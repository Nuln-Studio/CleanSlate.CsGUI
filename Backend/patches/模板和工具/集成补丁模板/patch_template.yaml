#自定义临时补丁配置文件（至少要这五个项，别的随便加但是这四项要是头）
#还有不能加、做破坏系统损害他人隐私的补丁，也请大家下载的时候好好看好了，不确定就不要随便下第三方非正式的补丁，本身这个程序运行就要管理员，恶意补丁连管理员都不用要了，所以没有代码基础还是建议这些人去用我本人的补丁OK吧¯꒳¯

id: patch_template #补丁的标识，这个是必须要改的，ID和别的补丁重复可能导致补丁加载失败
type: permanent    #补丁类型（permanent就加入程序注册表，说白了就是永久加入程序扫描and清理项，once就是跑一次就没了，下次要重新加载补丁）
self_destruct: false   #开不开启自删除，就是跑一次就没了自己删了，不建议改成true万一跑失败了还得重新下你自己想麻不麻烦吧(ᗜ ˰ ᗜ) 
name: 自定义集成补丁  #名字，加载补丁会显示名字 比较标准的写法（最推荐）：自定义名字-作者
risk: low #风险，low/medium/high，最好按照实际情况，作者本人反正会好好填社区的没法直接保证哈